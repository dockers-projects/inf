name: Mirror Ollama model to Yandex Object Storage

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Ollama model or 'ollama pull MODEL', e.g. gpt-oss:20b"
        type: string
        required: true
      s3_prefix:
        description: "S3 prefix (no leading slash)"
        type: string
        required: true
        default: "ollama"
      part_mib:
        description: "Multipart part size in MiB (8..256)"
        type: choice
        required: true
        default: "32"
        options:
          - "8"
          - "16"
          - "32"
          - "64"
          - "128"
          - "256"

permissions:
  contents: read

concurrency:
  group: mirror-${{ inputs.s3_prefix }}
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Mirror
        env:
          YC_S3_ACCESS_KEY_ID: ${{ secrets.YC_S3_ACCESS_KEY_ID }}
          YC_S3_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET_ACCESS_KEY }}
          YC_S3_BUCKET: ${{ vars.YC_S3_BUCKET }}
          MODEL: ${{ inputs.model }}
          PREFIX: ${{ inputs.s3_prefix }}
          PART_MIB: ${{ inputs.part_mib }}
        run: python scripts/mirror.py "$MODEL" --prefix "$PREFIX" --part-mib "$PART_MIB"
